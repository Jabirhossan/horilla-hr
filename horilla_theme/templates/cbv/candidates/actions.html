{% load static i18n generic_template_filters %}

<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation()">
    {% if perms.recruitment.change_candidate %}
        <a
            class="oh-btn oh-btn--light-bkg px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
            title="{% trans 'Edit' %}"
            href="{% url 'rec-candidate-update' instance.id %}?container=true"
            hx-get="{% url 'rec-candidate-update' instance.id %}?container=true"
            hx-target="#listContainer"
            hx-swap="innerHTML"
            hx-push-url="true"
        >
            <ion-icon name="create-outline"></ion-icon>
            {% trans 'Edit' %}
        </a>
    {% endif %}
    {% if perms.recruitment.view_candidate %}
        <a
            class="oh-btn oh-btn--light-bkg px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
            title="{% trans 'View' %}"
            href="{% url 'candidate-view-individual' instance.id %}"
        >
            <ion-icon name="eye-outline"></ion-icon>
            {% trans 'View' %}
        </a>
    {% endif %}
    {% if perms.recruitment.delete_candidate %}
        <a
            class="oh-btn oh-btn--danger px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
            title="{% trans 'Delete' %}"
            hx-get="{% url 'generic-delete' %}?model=recruitment.Candidate&pk={{instance.id}}"
            hx-target="#deleteConfirmationBody"
            data-toggle="oh-modal-toggle"
            data-target="#deleteConfirmation"
        >
            <ion-icon name="trash-outline"></ion-icon>
            {% trans 'Delete' %}
        </a>
    {% endif %}
</div>
